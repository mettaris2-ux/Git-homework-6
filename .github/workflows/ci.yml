name: Node.js CI
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: check
      run: | 
        echo "Repo has clonned"
        ls -la
        if [ -f index.html ]; then
          echo "index.hyml has exist"
        else
          exist 1
        fi